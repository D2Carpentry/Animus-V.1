<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ANIMUS Mobile</title>
    <meta name="theme-color" content="#0d4a91">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="mobile.css?v=20260809-mobile-v2">
  </head>
  <body>
    <main class="mobile-shell">
      <header class="mobile-topbar">
        <div class="mobile-brand">
          <img src="assets/d2-logo.png" alt="D2 Carpentry and Design logo">
          <div>
            <p>D2 Carpentry and Design</p>
            <h1>ANIMUS</h1>
          </div>
        </div>
        <button type="button" class="mobile-menu-button" id="mobileMenuButton" aria-label="Open menu" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </header>

      <div class="mobile-menu-backdrop" id="mobileMenuBackdrop" hidden></div>
      <aside class="mobile-menu-panel" id="mobileMenuPanel" hidden>
        <div class="mobile-menu-head">
          <div>
            <p class="eyebrow">ANIMUS</p>
            <h2>Menu</h2>
          </div>
          <button type="button" id="mobileMenuClose" aria-label="Close menu">×</button>
        </div>
        <div class="mobile-menu-list">
          <button type="button" id="mobileNewFile">+ New File</button>
          <button type="button" data-mobile-tab="files">Command Center</button>
          <button type="button" data-mobile-tab="calendar">Calendar</button>
          <button type="button" data-mobile-tab="estimate">Estimator</button>
          <button type="button" data-mobile-tab="revenue">Revenue</button>
          <button type="button" data-mobile-tab="more">More</button>
          <button type="button" id="mobileSaveCloud">Save</button>
          <button type="button" id="mobileLoadCloud">Load Cloud</button>
          <button type="button" id="mobileOpenDesktop">Desktop Command Center</button>
          <button type="button" id="mobileOpenPriceDb">Price Database</button>
        </div>
      </aside>

      <section class="mobile-hero">
        <div>
          <p class="eyebrow">Command Center</p>
          <h2 id="mobileViewTitle">Files</h2>
        </div>
      </section>

      <section class="mobile-view active" id="mobileFilesView">
        <div class="mobile-filter-row">
          <select id="mobileFileFilter" aria-label="File filter">
            <option value="all">All Files</option>
            <option value="new">New Leads</option>
            <option value="contact">Pending Contact</option>
            <option value="estimate">Pending Estimates</option>
            <option value="negotiation">In Negotiation</option>
            <option value="active">Active Jobs</option>
            <option value="archive">Closed Files</option>
          </select>
        </div>
        <div class="mobile-search">
          <input id="mobileSearch" type="search" placeholder="Search name, phone, or file #">
        </div>
        <div class="mobile-file-list" id="mobileFileList"></div>
      </section>

      <section class="mobile-view" id="mobileDetailView">
        <button type="button" class="mobile-back" data-mobile-tab="files">Back to Files</button>
        <article class="mobile-card mobile-file-editor mobile-collapsible is-open">
          <button type="button" class="mobile-section-toggle" data-mobile-toggle-section>
            <span>
              <span class="eyebrow" id="mobileDetailNumber">File</span>
              <strong>Customer</strong>
            </span>
            <span class="mobile-section-arrow">›</span>
          </button>
          <div class="mobile-section-body">
            <input class="mobile-title-input" id="mobileClientName" placeholder="Client name">
            <div class="mobile-grid">
              <label>Phone<input id="mobileClientPhone" type="tel"></label>
              <label>Email<input id="mobileClientEmail" type="email"></label>
              <label class="full">Address<input id="mobileProjectAddress"></label>
              <label>Status<select id="mobileFileStatus"></select></label>
              <label>Detail<select id="mobileStatusDetail"></select></label>
              <label>Project Type<select id="mobileProjectType"></select></label>
              <label>Source<input id="mobileLeadSource"></label>
            </div>
          </div>
        </article>

        <article class="mobile-card mobile-collapsible">
          <button type="button" class="mobile-section-toggle" data-mobile-toggle-section>
            <span>
              <span class="eyebrow">Financials</span>
              <strong id="mobileMoneyTitle">$0.00</strong>
            </span>
            <span class="mobile-section-right">
              <span id="mobileBalanceBadge">$0.00 due</span>
              <span class="mobile-section-arrow">›</span>
            </span>
          </button>
          <div class="mobile-section-body">
            <div class="mobile-grid">
              <label>Estimate<input id="mobileEstimateTotal" type="number" min="0" step="0.01"></label>
              <label>Materials<input id="mobileMaterialTotal" type="number" min="0" step="0.01"></label>
              <label>Initial Deposit<input id="mobileInitialDeposit" type="number" min="0" step="0.01"></label>
              <label>Midpoint<input id="mobileMidpointDeposit" type="number" min="0" step="0.01"></label>
              <label>Final Payment<input id="mobileFinalPaymentAmount" type="number" min="0" step="0.01"></label>
              <label>Paid in Full<select id="mobilePaidInFull"><option>No</option><option>Yes</option></select></label>
            </div>
          </div>
        </article>

        <article class="mobile-card mobile-collapsible">
          <button type="button" class="mobile-section-toggle" data-mobile-toggle-section>
            <span>
              <span class="eyebrow">Schedule</span>
              <strong>Dates</strong>
            </span>
            <span class="mobile-section-arrow">›</span>
          </button>
          <div class="mobile-section-body">
            <div class="mobile-grid">
              <label>Inspection<input id="mobileInspectionDate" type="date"></label>
              <label>Inspection Time<input id="mobileInspectionTime" type="time"></label>
              <label>Start Date<input id="mobileStartDate" type="date"></label>
              <label>Follow-Up<input id="mobileFollowUpDate" type="date"></label>
              <label class="full">Completion<input id="mobileAnticipatedCompletionDate" type="date"></label>
            </div>
          </div>
        </article>

        <article class="mobile-card mobile-collapsible">
          <button type="button" class="mobile-section-toggle" data-mobile-toggle-section>
            <span>
              <span class="eyebrow">Notes</span>
              <strong>File Notes</strong>
            </span>
            <span class="mobile-section-arrow">›</span>
          </button>
          <div class="mobile-section-body">
            <button type="button" id="mobileAddNote">Add Note</button>
            <textarea id="mobileNewNote" rows="3" placeholder="Add a note"></textarea>
            <div class="mobile-notes" id="mobileNotes"></div>
          </div>
        </article>

        <div class="mobile-action-row">
          <button type="button" id="mobileOpenEstimate">Estimate</button>
          <button type="button" id="mobileOpenExpenses">Expenses</button>
        </div>
      </section>

      <section class="mobile-view" id="mobileCalendarView">
        <div class="mobile-calendar-actions">
          <button type="button" id="mobileImportGoogleCalendar">Import Google</button>
          <button type="button" id="mobileSyncCalendar">Sync Upcoming</button>
          <button type="button" id="mobileOpenGoogleCalendar">Open Google</button>
        </div>
        <div class="mobile-month-head">
          <button type="button" id="mobilePrevMonth">Previous</button>
          <h2 id="mobileMonthTitle">Month</h2>
          <button type="button" id="mobileNextMonth">Next</button>
        </div>
        <div class="mobile-calendar" id="mobileCalendarGrid"></div>
        <article class="mobile-card">
          <p class="eyebrow">Selected Day</p>
          <h3 id="mobileSelectedDayTitle">Today</h3>
          <div class="mobile-day-events" id="mobileSelectedDayEvents"></div>
        </article>
      </section>

      <section class="mobile-view" id="mobileEstimateView">
        <iframe id="mobileEstimatorFrame" title="D2 Estimator"></iframe>
      </section>

      <section class="mobile-view" id="mobileRevenueView">
        <div class="mobile-stat-grid">
          <article><span>Gross</span><strong id="mobileRevenueGross">$0.00</strong></article>
          <article><span>Expenses</span><strong id="mobileRevenueExpenses">$0.00</strong></article>
          <article><span>Labor</span><strong id="mobileRevenueLabor">$0.00</strong></article>
          <article><span>Profit</span><strong id="mobileRevenueProfit">$0.00</strong></article>
        </div>
        <div class="mobile-revenue-list" id="mobileRevenueList"></div>
      </section>

      <section class="mobile-view" id="mobileMoreView">
        <article class="mobile-card">
          <p class="eyebrow">Tools</p>
          <p class="mobile-helper">Use the menu button in the top corner for files, calendar, estimator, revenue, cloud save, desktop view, and the price database.</p>
        </article>
      </section>
    </main>

    <script src="dashboard-restore-data.js?v=20260805-mobile-sync"></script>
    <script src="revenue-data.js?v=20260805-mobile-sync"></script>
    <script src="materials-database.js?v=20260804-price-update-2"></script>
    <script src="mobile.js?v=20260809-mobile-calendar-sync"></script>
  </body>
</html>
