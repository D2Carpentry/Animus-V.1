<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071a33">
  <title>ANIMUS Document</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#172033;font-family:Inter,Arial,sans-serif}.toolbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:#071a33;color:#fff}.toolbar strong{font-size:14px}.toolbar div{display:flex;gap:8px}.toolbar button{min-height:40px;padding:0 12px;border:1px solid #34506f;border-radius:8px;background:#fff;color:#123b72;font-weight:800}.sheet{width:min(100% - 24px,820px);margin:16px auto;padding:24px;background:#fff;box-shadow:0 8px 30px rgba(15,23,42,.12)}.doc-head{display:grid;grid-template-columns:1fr auto;gap:20px;padding-bottom:18px;border-bottom:3px solid #123b72}.doc-head h1{margin:0;color:#123b72;font-size:24px}.doc-head p{margin:6px 0 0;color:#64748b}.doc-meta{text-align:right;font-size:12px}.client{padding:18px 0}.client h2{margin:0 0 8px;font-size:17px}.client p{margin:4px 0;color:#475569;font-size:13px}.lines{width:100%;border-collapse:collapse}.lines th{padding:10px 8px;background:#123b72;color:#fff;font-size:11px;text-align:left}.lines th:last-child,.lines td:last-child{text-align:right}.lines td{padding:10px 8px;border-bottom:1px solid #e2e8f0;font-size:13px}.lines .section td{background:#eef4fb;color:#123b72;font-weight:850}.lines .note td{color:#64748b;font-style:italic}.totals{display:grid;gap:7px;width:min(100%,310px);margin:20px 0 0 auto}.totals div{display:flex;justify-content:space-between;gap:18px}.totals .grand{padding-top:9px;border-top:2px solid #123b72;color:#123b72;font-size:18px}.notes{margin-top:22px;padding:14px;background:#f8fafc;border-left:4px solid #c99a42;white-space:pre-wrap;font-size:13px;line-height:1.5}.error{padding:50px 20px;text-align:center;color:#64748b}@media(max-width:520px){.sheet{width:100%;margin:0;padding:18px 14px;box-shadow:none}.doc-head{grid-template-columns:1fr}.doc-meta{text-align:left}.toolbar{padding-top:max(12px,env(safe-area-inset-top))}}@media print{body{background:#fff}.toolbar{display:none}.sheet{width:100%;margin:0;padding:0;box-shadow:none}}
  </style>
</head>
<body>
  <header class="toolbar"><strong>ANIMUS Estimate</strong><div><button type="button" onclick="window.close()">Close</button><button type="button" onclick="window.print()">Print / Save PDF</button></div></header>
  <main id="document"><p class="error">Loading current estimate from ANIMUS cloud...</p></main>
  <script>
    const API="https://animus-v-1.pages.dev/api/dashboard";
    const esc=(value="")=>String(value).replace(/[&<>"']/g,(char)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));
    const money=(value)=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(Number(value)||0);
    const params=new URLSearchParams(location.search);
    async function load(){
      try{
        const response=await fetch(`${API}?t=${Date.now()}`,{cache:"no-store"});
        const result=await response.json();
        if(!response.ok||result.ok===false) throw new Error(result.error||"Cloud document could not be loaded.");
        const files=result.dashboard?.dashboardFiles||[];
        const file=files.find((entry)=>String(entry.id||"")===params.get("fileId"));
        const estimate=file?.editableEstimate;
        if(!file||!estimate) throw new Error("No current editable estimate is attached to this work file.");
        const totals=estimate.totals||{};
        const rows=(estimate.lineItems||estimate.scope||[]).map((line)=>{const type=line.type||"item";const total=Number(line.total ?? ((Number(line.qty)||1)*(Number(line.price||line.unitPrice)||0)))||0;if(type==="section")return `<tr class="section"><td colspan="2">${esc(line.description||line.name||"")}</td><td>${total?money(total):""}</td></tr>`;if(type==="note")return `<tr class="note"><td colspan="3">${esc(line.description||line.name||"")}</td></tr>`;return `<tr><td>${esc(line.description||line.name||"")}</td><td>${esc(line.qty||line.quantity||"")}</td><td>${total?money(total):""}</td></tr>`;}).join("");
        document.getElementById("document").innerHTML=`<article class="sheet"><header class="doc-head"><div><h1>${esc(estimate.companyName||"D2 Carpentry & Design")}</h1><p>${esc(estimate.estimateTitle||estimate.title||"Estimate")}</p></div><div class="doc-meta"><strong>${esc(estimate.estimateNumber||file.fileNumber||"")}</strong><br>${esc(estimate.estimateDate||estimate.date||"")}</div></header><section class="client"><h2>${esc(estimate.clientName||file.clientName||"Client")}</h2><p>${esc(estimate.clientPhone||file.clientPhone||"")}</p><p>${esc(estimate.clientEmail||file.clientEmail||"")}</p><p>${esc(estimate.projectAddress||file.projectAddress||"")}</p></section><table class="lines"><thead><tr><th>Description</th><th>Qty</th><th>Total</th></tr></thead><tbody>${rows||'<tr><td colspan="3">No estimate lines saved.</td></tr>'}</tbody></table><section class="totals"><div><span>Subtotal</span><strong>${money(totals.subtotal ?? totals.total)}</strong></div>${Number(totals.discount)?`<div><span>Discount</span><strong>-${money(totals.discount)}</strong></div>`:""}${Number(totals.tax)?`<div><span>Tax</span><strong>${money(totals.tax)}</strong></div>`:""}<div class="grand"><span>Total</span><strong>${money(totals.total||file.estimateTotal)}</strong></div></section>${estimate.notes?`<section class="notes">${esc(estimate.notes)}</section>`:""}</article>`;
      }catch(error){document.getElementById("document").innerHTML=`<p class="error">${esc(error.message||"Document could not be opened.")}</p>`;}
    }
    load();
  </script>
</body>
</html>
